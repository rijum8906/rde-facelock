<!DOCTYPE busconfig PUBLIC
    "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

    <!-- Who may OWN the name -->
    <policy user="root">
        <allow own="org.rde.FaceLock"/>
    </policy>

    <!-- Everyone else: may TALK to the service -->
    <policy context="default">
        <allow send_destination="org.rde.FaceLock"/>
        <allow receive_sender="org.rde.FaceLock"/>
    </policy>

</busconfig>
